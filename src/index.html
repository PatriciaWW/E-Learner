<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smart Reader</title>
  <meta name="description" content="An AI-powered reading assistant — text-to-speech, adaptive chunking, and student profiles.">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

  <script>
    var wobbleElements = document.querySelectorAll('.wobble');

    wobbleElements.forEach(function(el){
      el.addEventListener('mouseover', function(){
        
        if(!el.classList.contains('animating') && !el.classList.contains('mouseover')){
        
          el.classList.add('animating','mouseover');
        
          var letters = el.innerText.split('');
          
          setTimeout(function(){ el.classList.remove('animating'); }, (letters.length + 1) * 50);
          
          var animationName = el.dataset.animation;
          if(!animationName){ animationName = "jump"; }
        
          el.innerText = '';
        
          letters.forEach(function(letter){
            if(letter == " "){
              letter = "&nbsp;";
            }
            el.innerHTML += '<span class="letter">'+letter+'</span>';
          });
          
          var letterElements = el.querySelectorAll('.letter');
          letterElements.forEach(function(letter, i){
            setTimeout(function(){
              letter.classList.add(animationName);
            }, 50 * i);
          });
          
        }
        
      });
      
      el.addEventListener('mouseout', function(){				
        el.classList.remove('mouseover');
      });
    });
  </script>


  
</body>
</html>
