<div class="app-shell">
  @if (db.currentProfile(); as profile) {
    <header class="top-nav">
      <div class="brand">
        <span class="logo-badge">EL</span>
        E-Learner
      </div>

      <nav>
        <a routerLink="/reader" routerLinkActive="active-link">📄 Reader</a>
        <a routerLink="/profile" routerLinkActive="active-link">👤 Profile</a>
        <a routerLink="/journey" routerLinkActive="active-link">🗺️ Journey</a>
        <a routerLink="/code/:topic" routerLinkActive="active-link">💻 Code</a>
        

      </nav>

      <div class="spacer"></div>

      <div class="nav-profile">
        <span class="nav-avatar">{{ profile.avatar }}</span>
        {{ profile.name }} · ⭐ {{ profile.totalScore }}
      </div>
    </header>
  }

  <div class="app-main">
    <router-outlet></router-outlet>
  </div>
</div>
