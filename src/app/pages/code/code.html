<app-nav />


<section class="container-fluid p-3">
    <h3 class="text-center udog wobble fw-bold mt-4 " data-animation="leap">My Code </h3>

    <div class="d-flex mb-5 ">
        <button class="btn secondary-btn squishy-btn udog" [routerLink]="['/quiz']">
            Quiz! 
        </button>
    </div>
    <div class="row">
        <div class="col-md-6 " >
            <div class="p-3 std mt-1">
                
                <div class="d-flex gap-3 mb-3" role="group" aria-label="Basic mixed styles example">
                    <button (click)="runPythonCode()" class="btn orange-btn flex-fill">Run Code</button>
                </div>

                <div class="p-1">
                    <div #editorContainer style="width: 100%; height: 400px;" class="mb-3"></div>

                </div>
                
            </div>

        </div>
        
        <div class="col-md-6 p-3">
            
            <div class="shadow2 p-3 robot h-100 bg-code">
                <h4 class="mt-2 text-center">Output: </h4>
                <h4 class="mb-3">{{ output }}</h4>
               
            </div>
        </div>

    </div>

</section>



<app-footer/>
