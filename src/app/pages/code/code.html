<app-nav />


<section class="container-fluid p-3">

    <div class="d-flex justify-content-between mt-4 mb-5">
        <button class="btn secondary-btn squishy-btn udog" [routerLink]="['/flash', t_name]">
            <i class="bi bi-arrow-return-left"></i>
            Cards 
        </button>

        <h3 class="text-center udog wobble fw-bold" data-animation="leap">My Code{{ topic?.title }}</h3>

        <button class="btn secondary-btn squishy-btn udog" [routerLink]="['/quiz/'+ t_name]">
            <i class="bi bi-arrow-return-right"></i>
            Quiz! 
        </button>

    </div>
    <div class="row">
        <div class="col-md-6 " >
            <div class="p-3 std mt-3">
                <h6>{{ topic?.intro }}</h6>

                <!-- select prompts for ai to explain -->
                <select class="form-control mb-3" [(ngModel)]="selected_prompt" (change)="loadPrompts()">
                    <option value="">--Ask a question--</option>
                    <option *ngFor="let prompt of topic.prompts" [ngValue]="prompt">{{prompt}} </option>
                </select>

                <div>@if (topic.id == 'math') {
                    <!-- <p class="">Click the 'Run Code' Button to see the Output of your Python Code .</p> -->
                    <p>Choose the Math operation you want to perform below : </p>

                    <select (change)="fetchPythonCode($event)" class="form-control mb-3">
                        <option value="">Select one :</option>
                        <option value="addition">Addition</option>
                        <option value="subtraction">Subtraction</option>
                        <option value="multiplication">Multiplication</option>
                        <option value="division">Division</option>
                    </select>
                    }
                </div>
                
                <div class="d-flex gap-3 mt-3 mb-3" role="group" aria-label="Basic mixed styles example">
                    <button (click)="runPythonCode()" class="btn orange-btn flex-fill">Run Code</button>
                    <button (click)="runPythonAi()" class="btn red-btn flex-fill">Explain</button>
                    <!-- <button id="runButton" (click)="runPythonAi()" class="btn orange-btn udog">Run Code</button> -->
                </div>

                <div class="p-1">
                    <div #editorContainer style="width: 100%; height: 400px;" class="mb-3"></div>

                </div>
                
            </div>

        </div>
        
        <div class="col-md-6 p-3">
            
            <div class="shadow2 p-3 robot h-100 bg-code">
                <h4 class="mt-2 text-center">Output: </h4>
                <h4 class="mb-3">{{ output }}</h4>
                <ul class="ai-output-list mb-3">
                    <li>@for (point of ai_output; track point){
                        {{ point }}
                    }
                    </li>
                </ul>
                
            </div>
        </div>

    </div>

</section>



<app-footer/>
