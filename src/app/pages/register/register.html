<section class="std">


<div class="register-screen">
  <div class="profile-hero text-center">
    <div class="profile-logo">
      <svg viewBox="0 0 40 40" width="48" height="48" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="cyan" />
        <text x="50%" y="57%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="18"
          font-family="Lexend,sans-serif" font-weight="bold">SR</text>
      </svg>
      <h1 class="bungee">SMART READER</h1>
    </div>
    
    <h5 class="">Personalised learning for every student</h5>
  </div>


  <div>
    @if (existingProfiles().length) {
      <h4 class="text-center">Welcome back!</h4>

      <div class="profile-card-area" aria-label="Existing student profiles">
        @for (p of existingProfiles(); track p.id) {
          <button class="profile-card squishy-btn" [attr.aria-label]="'Continue as ' + p.name + ', score ' + p.totalScore"
            (click)="continueAs(p)">
            <span class="card-avatar">{{ p.avatar }}</span>
            <span class="card-name">{{ p.name }}</span>
            <span class="card-score">⭐ {{ totalPoints }} pts</span>
          </button>
        }
      </div>
    }
  </div>

  <form class="carda" (ngSubmit)="register()" #f="ngForm">
    <h2>Create Your Profile</h2>

    <div class="form-group">
      <label for="student-name">Your Name</label>
      <input type="text" id="student-name" name="name" placeholder="e.g. Alex" class="form-input"
        [class.error]="nameError" [(ngModel)]="name" autocomplete="given-name" aria-required="true" />
      @if (nameError) {
        <span class="error-text">Please enter a name to continue.</span>
      }
    </div>

    <div class="form-group">
     <span class="group-label" id="avatar-picker-label">Choose an Avatar</span>
    <div class="avatar-picker" role="radiogroup" aria-labelledby="avatar-picker-label">
        @for (a of avatars; track a.emoji) {
          <button type="button" class="avatar-btn" [class.selected]="selectedAvatar === a.emoji"
            [attr.aria-pressed]="selectedAvatar === a.emoji" [attr.aria-label]="a.label" (click)="pickAvatar(a.emoji)">
            {{ a.emoji }}
          </button>
        }
      </div>
    </div>

    <div class="form-group">
      <label for="learning-mode">Preferred Learning Mode</label>
      <select id="learning-mode" name="learningMode" class="form-input" [(ngModel)]="learningMode">
        <option value="audio">Audio First (I listen well)</option>
        <option value="visual">Visual First (I learn from images)</option>
        <option value="reading">Reading First (I prefer text)</option>
        <option value="mixed">Mixed (Show me everything)</option>
      </select>
    </div>

    <button type="submit" class="primary-btn full-width squishy-btn">Start Learning →</button>
  </form>
</div>


</section>
